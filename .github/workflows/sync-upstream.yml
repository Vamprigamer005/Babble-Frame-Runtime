name: Sync upstream

# Keeps this fork current with Project-Babble/Babble-Frame-Runtime on its own. Every few hours it looks for a new
# upstream stable release; when there is one that this fork has not built yet, it merges that release into main
# and starts the Build workflow to publish "<upstream tag>-101" (the fork's version scheme, see README). A merge
# conflict fails this job so someone can resolve it by hand; nothing is force-pushed.
#
# GitHub turns scheduled workflows off after 60 days without any commit to the repository, and emails the owner.
# A quiet upstream can trigger that; re-enable it on the Actions page when it happens.

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if a fork release for the newest upstream release already exists'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

# One run at a time, so a slow run and the next timer tick never both merge and push.
concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: Project-Babble/Babble-Frame-Runtime
  FORK_BUILD: '101'

jobs:
  sync:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Find the newest upstream stable release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only tags of the form Vx.y-Release count, and the highest version wins, not the newest upload.
          tag="$(gh api "repos/${UPSTREAM}/releases?per_page=50" --jq '
            [.[] | select(.draft|not) | select(.prerelease|not)
                 | select(.tag_name | test("^V[0-9]+\\.[0-9]+-Release$"))
                 | .tag_name]
            | sort_by(capture("^V(?<a>[0-9]+)\\.(?<b>[0-9]+)-Release$") | [(.a|tonumber), (.b|tonumber)])
            | last // empty')"
          if [[ -z "$tag" ]]; then
            echo "No upstream stable release found." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Upstream newest release: $tag"

      - name: Check whether this fork already built it
        id: ours
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=50" --jq '.[].tag_name' > fork_tags.txt
          echo "Fork releases:"; cat fork_tags.txt
          # Fork builds of this tag are "<tag>-<number>". The dot in the tag is escaped for the regex.
          pattern="^${TAG//./\\.}-[0-9]+\$"
          echo "$pattern" > fork_pattern.txt
          have="$(grep -cE -- "$pattern" fork_tags.txt || true)"
          if [[ "$have" != "0" && "$FORCE" != "true" ]]; then
            echo "A fork release for $TAG exists already ($have found); nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge the upstream release into main
        if: steps.ours.outputs.build == 'true'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch --no-tags upstream "refs/tags/${TAG}:refs/tags/upstream/${TAG}"
          if git merge-base --is-ancestor "upstream/${TAG}" HEAD; then
            echo "main already contains upstream $TAG."
          else
            if ! git merge --no-edit -m "Merge upstream ${TAG}" "upstream/${TAG}"; then
              echo "::error::Merging upstream ${TAG} conflicts with the fork's changes; resolve by hand."
              git diff --name-only --diff-filter=U
              exit 1
            fi
            git push origin HEAD:main
          fi

      - name: Start the Build workflow
        if: steps.ours.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          # The next free build number for this upstream tag: 101, or one more than the highest one published.
          # grep finds nothing for a new tag, which is the normal case, so its exit status must not end the step.
          n="$( { grep -E -- "$(cat fork_pattern.txt)" fork_tags.txt || true; } | sed "s/^${TAG}-//" | sort -n | tail -n1)"
          build="${FORK_BUILD}"
          if [[ -n "$n" && "$n" -ge "$FORK_BUILD" ]]; then build=$((n + 1)); fi
          version="${TAG}-${build}"
          echo "Dispatching Build for ${version}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/dispatches" \
            -f ref=main \
            -f "inputs[publish-release]=true" \
            -f "inputs[version-number]=${version}" \
            -f "inputs[release-name-info]=Vive Facial Tracker" \
            -f "inputs[release-notes]=Upstream ${TAG} with Vive Facial Tracker support (see README). Upstream notes: https://github.com/${UPSTREAM}/releases/tag/${TAG}"
          echo "Build started for ${version}."
